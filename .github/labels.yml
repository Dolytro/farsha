# Source of truth for the repository labels. Keep this file and the labels on GitHub in sync
# (see "Labels" in CONTRIBUTING.md for the one-line command that applies it).

# Type
- {name: bug, color: d73a4a, description: "Something is not working"}
- {name: enhancement, color: a2eeef, description: "New feature or request"}
- {name: figma-parity, color: 7c5cff, description: "Behaviour, label or shortcut differs from Figma"}
- {name: documentation, color: 0075ca, description: "Improvements or additions to documentation"}
- {name: performance, color: fbca04, description: "Speed or memory use"}
- {name: refactor, color: c5def5, description: "Code change that does not alter behaviour"}
- {name: chore, color: ededed, description: "Maintenance, tooling or housekeeping"}
- {name: security, color: b60205, description: "Security related (report vulnerabilities privately, see SECURITY.md)"}
- {name: accessibility, color: f143ab, description: "Barrier affecting people with disabilities"}
- {name: breaking-change, color: e11d21, description: "Changes behaviour or the .farsha file format in an incompatible way"}
- {name: question, color: d876e3, description: "Further information is requested"}

# Area
- {name: "area: canvas", color: 1d76db, description: "Canvas engine, rendering and tools"}
- {name: "area: design-core", color: 1d76db, description: "Document model and .farsha file format"}
- {name: "area: dev-mode", color: 1d76db, description: "Dev Mode and code generation"}
- {name: "area: ui", color: 1d76db, description: "Panels, toolbars and shared UI components"}
- {name: "area: drive", color: 1d76db, description: "Google sign-in and Google Drive saving"}
- {name: "area: api", color: 1d76db, description: "The API app"}
- {name: "area: site", color: 1d76db, description: "Landing site, privacy and terms pages"}
- {name: "area: build", color: 1d76db, description: "Build, CI, release and repository setup"}

# Status
- {name: needs-triage, color: ededed, description: "Not looked at by a maintainer yet"}
- {name: needs-info, color: fef2c0, description: "Waiting for more information from the reporter"}
- {name: confirmed, color: 0e8a16, description: "Reproduced or accepted by a maintainer"}
- {name: in progress, color: 5319e7, description: "Someone is working on this"}
- {name: blocked, color: b60205, description: "Waiting on something else"}
- {name: duplicate, color: cfd3d7, description: "This issue or pull request already exists"}
- {name: invalid, color: e4e669, description: "This does not seem right"}
- {name: wontfix, color: ffffff, description: "This will not be worked on"}
- {name: stale, color: 795548, description: "No activity for a long time"}

# Priority
- {name: "priority: high", color: d93f0b, description: "Should be fixed soon"}
- {name: "priority: medium", color: fbca04, description: "Normal priority"}
- {name: "priority: low", color: 0e8a16, description: "Nice to have"}

# Community
- {name: good first issue, color: 7057ff, description: "Good for newcomers"}
- {name: help wanted, color: 008672, description: "Extra attention is needed"}

# Dependencies and automation
- {name: dependencies, color: 0366d6, description: "Pull requests that update a dependency file"}
- {name: github_actions, color: 000000, description: "Pull requests that update GitHub Actions code"}
- {name: javascript, color: 168700, description: "Pull requests that update JavaScript code"}
- {name: ignore-for-release, color: ffffff, description: "Leave out of the generated release notes"}
