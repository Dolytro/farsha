name: Bug report
description: Something in Farsha does not work as expected
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Draw a rectangle
        2. ...
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: How does Figma behave?
      description: Farsha aims to match Figma. Tell us what Figma does in the same situation.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, GIFs or console errors
